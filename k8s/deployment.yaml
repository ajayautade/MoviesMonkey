apiVersion: apps/v1
kind: Deployment
metadata:
  name: moviemonkey
  namespace: moviemonkey
  labels:
    app: moviemonkey
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moviemonkey
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: moviemonkey
        version: v1
    spec:
      containers:
        - name: moviemonkey
          image: ajayautade/moviemonkey:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: moviemonkey-nginx-config
